id: poster_render_image
prompt: |
  The workspace contains a self-contained `poster.html` design. Produce a
  rendered PNG deliverable from it; do not merely describe the expected image.

  Required workflow:
  - Do not modify `poster.html`.
  - Call `load_skill` with `render-to-image` and follow its instructions.
  - Render `poster.html` to `output/orbit-poster.png` using the skill's
    provided renderer. Do not start a local server, browser, watcher, or
    interactive shell.
  - Read the resulting PNG with `read_file` after the renderer succeeds so you
    can confirm it is a readable image and record its reported dimensions.
  - Create `render_report.json` as valid JSON with these fields only:
    `source`, `output`, `format`, `width`, and `height`. Its values must report
    the actual source/output paths, `PNG`, and the dimensions reported by the
    successful image read.

  This is an image-render workflow benchmark. The renderer may make its own
  bounded external request; do not substitute a screenshot, a hand-written
  placeholder PNG, or a different rendering tool. Use short bounded checks
  only, then state the actual renderer/read result in the final answer.
seed_dir: fixtures/poster_render_image
timeout_seconds: 60000
max_turns: 120
judge:
  rubric: |
    Assess the render workflow from the workspace, artifact metadata, and
    agent trajectory. `poster.html` must remain present and its original Orbit
    conference content must remain intact. `output/orbit-poster.png` must
    exist as a non-empty declared image artifact. `render_report.json` must be
    valid JSON with exactly source, output, format, width, and height; it must
    identify poster.html, output/orbit-poster.png, PNG, and positive numeric
    dimensions. Award credit only when the trajectory demonstrates a successful
    render-to-image skill workflow followed by an image read. The judge must
    also read `output/orbit-poster.png` and visually confirm that it is a
    legible rendering of the supplied dark Orbit 2026 conference poster, with
    the headline and colored planet/orbit composition visibly present.
  pass_score: 0.8
  artifacts:
    - path: poster.html
      mode: text
    - path: output/orbit-poster.png
      mode: image
    - path: render_report.json
      mode: text
