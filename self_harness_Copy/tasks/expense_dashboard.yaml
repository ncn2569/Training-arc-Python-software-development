id: expense_dashboard
prompt: 'Create a personal expense dashboard for September 2026. Show a monthly balance
  card, income and spending totals, a category breakdown, and a recent-transactions
  table. Include an add-expense form that updates the totals and category visualization
  in the browser. Persist added data with localStorage when available. Use realistic
  currency values and polished dashboard styling.


  Work only with files in the current workspace. Build a self-contained static

  website: CSS and JavaScript must be inside index.html, with no external CDN,

  package installation, backend, build step, or network dependency.


  Do not start or leave running any server or interactive program. In particular,

  do not run uvicorn, flask, npm start, vite, webpack dev server, python -m

  http.server, or a bare python/node shell. Use file tools and short non-server

  verification commands only. Before finalizing, read the created file or run a

  safe syntax/content check; then state what you verified.'
seed_dir: fixtures/expense_dashboard
timeout_seconds: 100000
max_turns: 100000
judge:
  rubric: Assess index.html source only. It must define balance, income, spending,
    category, and transaction data plus an add-expense control. Verify from the
    JavaScript that adding an expense updates totals and category data, and that
    localStorage is used or guarded safely. Do not require a rendered page, screenshot,
    or image inspection.
  pass_score: 0.8
  artifacts:
  - path: index.html
    mode: text
