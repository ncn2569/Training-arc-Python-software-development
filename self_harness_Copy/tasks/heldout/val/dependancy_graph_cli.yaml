id: val_dependency_graph_cli

timeout_seconds: 900

max_turns: 80

prompt: |
  Build a complete Python command-line tool named `depcheck` inside the current
  workspace. This is not a web application and must not use a database,
  frontend framework, HTTP server, Docker, or external packages.

  The tool analyzes software dependency graphs supplied as JSON.

  Input format:
  {
    "packages": [
      {"name": "app", "depends_on": ["core", "utils"]},
      {"name": "core", "depends_on": ["utils"]},
      {"name": "utils", "depends_on": []}
    ]
  }

  Required behavior:

  1. Validation
     - Reject duplicate package names.
     - Reject dependencies referring to unknown packages.
     - Reject malformed JSON or malformed package entries.
     - Print useful error messages to stderr.
     - Exit with a non-zero status for invalid input.

  2. `check`
     Command:
       python -m depcheck check graph.json

     Detect dependency cycles.
     - If acyclic, print that the graph is valid.
     - If cyclic, report at least one concrete cycle such as:
       a -> b -> c -> a
     - Return a non-zero exit status when a cycle exists.

  3. `order`
     Command:
       python -m depcheck order graph.json

     Produce a valid topological installation order where every dependency
     appears before packages that depend on it.
     Refuse to produce an order if the graph contains a cycle.

  4. `impact`
     Command:
       python -m depcheck impact graph.json utils

     Print all packages that directly or transitively depend on the selected
     package.
     Do not include the selected package itself.
     Results must be deterministic.

  5. `stats`
     Command:
       python -m depcheck stats graph.json

     Print:
     - number of packages
     - number of dependency edges
     - packages with zero dependencies
     - packages with the largest number of direct dependents

  Implementation requirements:
  - Python standard library only.
  - Separate parsing/validation, graph algorithms, and CLI concerns into
    sensible modules.
  - Graph algorithms must not depend on argparse, filesystem I/O, or printing.
  - Results must be deterministic regardless of input ordering.
  - Avoid recursion-depth-dependent behavior for large graphs where practical.

  Testing:
  - Add automated tests using Python's standard-library `unittest`.
  - Cover:
    * valid DAG
    * cycle detection
    * topological ordering
    * transitive impact
    * unknown dependency
    * duplicate package
    * malformed input
    * disconnected graph
  - Include at least one graph with more than one valid topological ordering;
    tests should verify correctness rather than require an arbitrary ordering,
    except where the implementation deliberately defines deterministic ordering.

  Documentation:
  - Add a concise README explaining the JSON format and all CLI commands,
    with example invocations.

  Work only inside the workspace.
  Do not install packages.
  Do not start servers, containers, watchers, REPLs, or interactive shells.
  Verification must use only short bounded commands such as targeted unittest
  execution, syntax checks, or direct CLI calls.
  State exactly which verification commands were actually run.

judge:
  pass_score: 0.8

  rubric: |
    Inspect the implementation as a standalone dependency-graph CLI.

    The parser must robustly reject malformed graph definitions, duplicate
    package names, and references to unknown dependencies.

    Cycle detection must correctly distinguish DAGs from cyclic graphs and
    surface a concrete cycle rather than merely returning a boolean.

    Topological ordering must guarantee that every dependency precedes its
    dependent package and must reject cyclic graphs.

    Impact analysis must compute reverse transitive dependency relationships,
    exclude the queried package itself, and produce deterministic output.

    Statistics must correctly derive package count, edge count, roots/leaves
    as requested, and packages with the largest direct dependent count.

    Core graph logic should be separated from CLI/filesystem concerns.
    The solution must use only the Python standard library.

    Tests should exercise algorithms and validation meaningfully rather than
    only checking that commands execute. Documentation and CLI behavior should
    agree with the implementation.

    Do not award credit for unsupported claims in the final response.

  artifacts:
    - {path: depcheck/__init__.py, mode: text}
    - {path: depcheck/__main__.py, mode: text}
    - {path: depcheck/parser.py, mode: text}
    - {path: depcheck/graph.py, mode: text}
    - {path: depcheck/cli.py, mode: text}
    - {path: tests/test_depcheck.py, mode: text}
    - {path: README.md, mode: text}