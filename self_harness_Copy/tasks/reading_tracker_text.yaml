id: reading_tracker_text
prompt: |
  Create a self-contained reading tracker in index.html. It must show a small
  initial library (title, author, genre, progress, and status), summary counts
  for total, reading, completed, and unread books, and controls to add a book
  and update a book's progress/status. Filtering by status or genre should work
  in the browser. Persist edits with localStorage when it is available.

  This is a source-code-only task: do not use screenshots, image-reading,
  browser rendering, or visual verification. Build the result by writing and
  reading files, then do a short non-server syntax/content check. The final
  answer should say what you created and what text-based check you ran.

  Work only with files in the current workspace. Put all CSS and JavaScript in
  index.html; use no external CDN, package installation, backend, build step,
  or network dependency. Do not start or leave running a server or interactive
  program. In particular do not run uvicorn, flask, npm start, vite, webpack
  dev server, python -m http.server, or a bare python/node shell.
seed_dir: fixtures/reading_tracker_text
timeout_seconds: 600
max_turns: 100
judge:
  rubric: |
    The source defines a usable reading tracker with realistic initial book
    data, summary counts, add/update interactions, filtering, and guarded
    localStorage persistence. The HTML, CSS, and JavaScript are self-contained
    in index.html. Assess the source text only; visual polish and rendered
    appearance are out of scope for this task.
  pass_score: 0.8
  artifacts:
    - path: index.html
      mode: text
