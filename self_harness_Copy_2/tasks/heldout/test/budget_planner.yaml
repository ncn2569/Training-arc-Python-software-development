id: test_budget_planner
seed_dir: fixtures/test_budget_planner
timeout_seconds: 600
max_turns: 40
prompt: |
  Build a monthly category-budget planner in index.html. Seed realistic budgets
  and spending entries. Show total budget, spent and remaining, per-category usage
  visualization and a transaction list. Let users add spending, delete an entry,
  and edit category budgets. Warn on over-budget categories without clipping the
  underlying remaining value; keep aggregates and charts consistent after edits.
  Validate amounts and safely persist state with localStorage. Include all CSS/JS
  inside HTML and use no external assets or dependencies.
  Work only in the workspace. No installation, servers, rendering, browser tools
  or interactive shells. Verify by source reads or short bounded non-server checks
  and describe which checks you actually performed.
judge:
  pass_score: 0.8
  rubric: |
    Inspect source only for budget/entry data, validated spending creation/deletion,
    editable category budgets, correct totals and category updates, over-budget
    handling, coherent visualization state and guarded persistence. No external
    assets or build requirements. Do not require a screenshot or running page.
  artifacts:
    - {path: index.html, mode: text}
