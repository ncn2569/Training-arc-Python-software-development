id: test_jsonl_redaction_cli
seed_dir: fixtures/test_jsonl_redaction_cli
timeout_seconds: 600
max_turns: 55
prompt: |
  Build a stdlib-only JSONL redaction CLI named redact_events.py. It accepts an
  input path and output path, processes one JSON object per input line, and
  writes valid compact JSONL. Recursively redact values for keys matching
  password, token, authorization or secret case-insensitively; preserve other
  values and key spelling. Do not mutate the parsed original object. Blank lines
  may be skipped, but malformed JSON must report the 1-based source line and
  exit non-zero without leaving a partially written output file. Add focused
  unittest coverage for nested lists/dicts, key-case variation, blank lines and
  malformed input. Do not install packages, access network or start services.
  Run bounded tests and state their actual result.
judge:
  pass_score: 0.85
  rubric: |
    Verify a usable stdlib CLI, recursive and case-insensitive key matching,
    preservation of non-sensitive values, atomic output behavior on malformed
    JSONL, useful line-numbered errors and meaningful focused tests. Source and
    test behavior matter more than a polished interface.
  artifacts:
    - {path: redact_events.py, mode: text}
    - {path: tests/test_redact_events.py, mode: text}
