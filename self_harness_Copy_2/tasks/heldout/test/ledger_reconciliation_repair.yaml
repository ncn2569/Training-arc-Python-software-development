id: test_ledger_reconciliation_repair
seed_dir: fixtures/test_ledger_reconciliation_repair
timeout_seconds: 600
max_turns: 45
prompt: |
  Repair the seeded Python ledger reconciler. Keep its public
  reconcile(entries) interface and return shape, but make it robust for
  financial cents. Entries have id, account, and amount_cents. Ignore a
  duplicate id after its first occurrence, reject blank account names and
  non-integer amounts, preserve negative balances, and return account balances
  in deterministic key order plus an exact total. Inspect the existing code and
  tests, run the bounded unittest target, repair the implementation, then rerun
  the same target. Do not install packages, access a network, or start a server.
  Report the real before/after test outcome.
judge:
  pass_score: 0.85
  rubric: |
    Inspect ledger.py and tests. The repair must handle duplicate ids,
    negative/zero cents, whitespace-only accounts, invalid amounts and stable
    ordering without changing the documented interface. The agent trajectory
    should show an initial bounded observation or test, an evidence-driven
    repair, and a post-repair bounded verification; do not award credit for
    deleting or weakening tests.
  artifacts:
    - {path: ledger.py, mode: text}
    - {path: tests/test_ledger.py, mode: text}
