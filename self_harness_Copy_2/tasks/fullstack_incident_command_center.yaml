id: fullstack_incident_command_center
prompt: |
  Build a production-shaped full-stack incident command center inside the
  current workspace. Create the complete source tree; do not merely describe
  it. This is source-code-only: do not start servers, Docker containers,
  watchers, browser automation, or interactive programs.

  Required architecture:
  - Frontend: React with Vite. Build an operator UI that lists incidents with
    severity/status/service filters, creates an incident, acknowledges or
    resolves it, and adds a timeline note. The UI must call the backend API,
    not maintain a mock-only state.
  - Backend: FastAPI with SQLAlchemy and SQLite. Model Incident and IncidentNote.
    Implement validated endpoints to list/filter incidents, create/get an
    incident, transition status `open -> acknowledged -> resolved`, and append
    a note. Reject invalid transitions and invalid payloads with clear errors.
    Configure CORS for the Vite development origin.
  - Deployment: docker-compose.yml must build local backend/frontend Dockerfiles,
    expose sensible ports, and persist the SQLite data with a named volume or
    explicit bind mount.
  - Tests: add pytest API tests for create/list filter, a valid transition, an
    invalid transition, and a note/timeline read. Tests must use an isolated
    temporary SQLite database rather than the deployment database.
  - Documentation: add a concise README with local, test, and Docker commands.

  Suggested layout: backend/app/{main,models,schemas,database}.py,
  backend/tests/test_incidents.py, backend/requirements.txt, backend/Dockerfile,
  frontend/{package.json,vite.config.js,src/main.jsx,src/App.jsx,Dockerfile},
  docker-compose.yml, README.md.

  Do not install packages or use the network. Verify by reading files or short,
  bounded non-server syntax/content checks only. Do not weaken/modify tests to
  hide failures. In the final answer, state created files and the checks actually
  run.
seed_dir: fixtures/fullstack_incident_command_center
timeout_seconds: 90000
max_turns: 1000
judge:
  rubric: |
    Assess source files only; do not require a running service, rendered page,
    screenshot, image inspection, or proof that Docker was executed.

    The repository must contain a coherent React/Vite client that calls FastAPI
    endpoints and supports incident list/filter/create/status transition/note
    behavior. FastAPI must define SQLAlchemy SQLite Incident and IncidentNote
    models, validated list/create/get/transition/note endpoints, explicit valid
    state transitions, and CORS. Docker Compose must build both local services,
    expose usable ports, and persist SQLite data. Backend pytest source must use
    an isolated test database and cover filtering, valid+invalid transitions,
    and timeline notes. Dependency files, Dockerfiles, and README commands must
    be internally consistent. Award no credit for claims unsupported by source.
  pass_score: 0.8
  artifacts:
    - path: backend/app/main.py
      mode: text
    - path: backend/app/models.py
      mode: text
    - path: backend/app/schemas.py
      mode: text
    - path: backend/app/database.py
      mode: text
    - path: backend/requirements.txt
      mode: text
    - path: backend/Dockerfile
      mode: text
    - path: backend/tests/test_incidents.py
      mode: text
    - path: frontend/package.json
      mode: text
    - path: frontend/vite.config.js
      mode: text
    - path: frontend/src/main.jsx
      mode: text
    - path: frontend/src/App.jsx
      mode: text
    - path: frontend/Dockerfile
      mode: text
    - path: docker-compose.yml
      mode: text
    - path: README.md
      mode: text
