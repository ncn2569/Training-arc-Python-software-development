<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Poster</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #07111f;
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      .poster {
        background: radial-gradient(circle at 70% 22%, #2d6cdf 0 2%, transparent 24%),
          linear-gradient(135deg, #102747, #0a1020 60%, #21113c);
        color: #f8fbff;
        height: 630px;
        overflow: hidden;
        padding: 64px;
        position: relative;
        width: 900px;
      }
      .orbit { border: 2px solid rgba(177, 213, 255, .34); border-radius: 50%; position: absolute; }
      .orbit.one { height: 620px; right: -105px; top: 90px; width: 620px; }
      .orbit.two { height: 430px; right: -9px; top: 185px; width: 430px; }
      .eyebrow { color: #8fd6ff; font-size: 18px; font-weight: 700; letter-spacing: 4px; margin: 0 0 28px; }
      h1 { font-size: 96px; letter-spacing: -5px; line-height: .9; margin: 0; max-width: 600px; }
      .date { font-size: 26px; font-weight: 700; margin-top: 48px; }
      .footer { bottom: 58px; color: #b5c5dc; font-size: 18px; left: 64px; position: absolute; }
      .planet { background: linear-gradient(135deg, #ffb46b, #df4b6c); border-radius: 50%; bottom: -75px; height: 260px; position: absolute; right: 68px; width: 260px; }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="Orbit design conference poster">
      <div class="orbit one"></div>
      <div class="orbit two"></div>
      <div class="planet"></div>
      <p class="eyebrow">DESIGN CONFERENCE</p>
      <h1>ORBIT<br />2026</h1>
      <p class="date">18–19 September · Bangkok</p>
      <p class="footer">Ideas in motion · Hall A · orbit.example</p>
    </main>
  </body>
</html>
