id: telemetry_window_repair
prompt: |
  Repair the existing Python telemetry aggregator. The public function
  `aggregate_readings(readings, *, window_seconds=60)` must ignore malformed
  readings and return deterministic per-device time-window summaries. A reading
  belongs to the window whose start is floor(timestamp / window_seconds) times
  window_seconds: exact boundaries begin a new window. Each summary needs
  device_id, window_start, count, and average (rounded to two decimals), sorted
  by device_id then window_start.

  Preserve the public function and the supplied tests. Read the existing source
  and tests before editing, then run the test file non-interactively. Do not add
  packages, use the network, start a server, or modify the tests to hide a
  failure. Work only in the current workspace. In the final answer, state the
  repaired behavior and the test command/output.
seed_dir: fixtures/telemetry_window_repair
timeout_seconds: 600
max_turns: 60
judge:
  rubric: |
    Verify from telemetry.py and an independent execution of the supplied tests
    that readings are bucketed with floor-based windows, exact boundaries do not
    merge with the preceding window, malformed records are ignored, averages
    are correct and rounded to two decimals, and summaries are deterministically
    ordered. The public aggregate_readings API and supplied tests must remain
    intact. Do not award credit merely because agent-authored tests pass.
  pass_score: 0.85
  artifacts:
    - path: telemetry.py
      mode: text
