id: test_offline_sync_conflicts
seed_dir: fixtures/test_offline_sync_conflicts
timeout_seconds: 600
max_turns: 50
prompt: |
  Repair the seeded offline-note merge function. Keep merge_notes(local, remote)
  and return a new mapping without mutating either input. For each note id choose
  the larger revision; on equal revisions choose the lexicographically later
  updated_at timestamp; if both tie choose the lexicographically smaller device
  id for deterministic output. A tombstone (deleted: true) follows the same
  ordering and must not be accidentally resurrected by an older note. Use the
  supplied unittest file to observe and recover from the intentional defect.
  Do not install dependencies or run services.
judge:
  pass_score: 0.85
  rubric: |
    Check immutable inputs, union of ids, deterministic conflict resolution,
    tombstones and non-UTC-looking timestamp strings handled as sortable values.
    The repair must be driven by a bounded failing test and a rerun, not by
    reducing test coverage.
  artifacts:
    - {path: sync.py, mode: text}
    - {path: tests/test_sync.py, mode: text}
