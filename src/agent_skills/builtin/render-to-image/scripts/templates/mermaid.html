<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        min-width: 100%;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        box-sizing: border-box;
        display: inline-block;
        padding: 24px;
      }

      #diagram {
        display: inline-block;
      }

      #diagram svg {
        display: block;
        max-width: none;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main id="diagram" aria-label="Mermaid diagram"></main>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs";

      const source = __MERMAID_SOURCE_JSON__;
      window.__RENDER_READY__ = false;
      window.__RENDER_ERROR__ = "";

      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
        const { svg } = await mermaid.render("render-to-image-diagram", source);
        document.querySelector("#diagram").innerHTML = svg;
        window.__RENDER_READY__ = true;
      } catch (error) {
        window.__RENDER_ERROR__ = String(error);
        document.body.dataset.renderError = window.__RENDER_ERROR__;
        throw error;
      }
    </script>
  </body>
</html>
